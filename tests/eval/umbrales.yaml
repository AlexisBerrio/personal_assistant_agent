# Umbrales de calidad para tests/eval/golden_router.jsonl.
# Cada cambio de umbral debe justificarse en el commit que lo modifica: bajar un umbral sin
# justificación es la forma más fácil de que la evaluación deje de proteger nada.

# Accuracy global: fracción de casos donde la acción resuelta por el router coincide
# exactamente con `intencion_esperada`.
accuracy_global_minima: 0.85

# Accuracy mínima por intención esperada (`IntentAction`). Evita que una intención poco
# frecuente en el dataset se degrade sin que se note en el promedio global.
accuracy_por_intencion_minima:
  list_tasks: 0.85
  create_task: 0.85
  complete_task: 0.80
  delete_task: 0.80
  ask_knowledge_base: 0.80
  small_talk: 0.90
  clarify: 0.75

# Banda de la tasa de `clarify` sobre el total de casos. Demasiado baja significa que el
# router está adivinando en vez de pedir aclaración; demasiado alta significa un asistente
# que no resuelve nada.
tasa_clarify_minima: 0.10
tasa_clarify_maxima: 0.45

# Precisión de extracción de entidades: sobre los casos con `entidades_esperadas` no vacío,
# fracción donde el payload contiene al menos una de las claves esperadas con valor no vacío.
precision_entidades_minima: 0.80

# Coste medio en tokens (entrada + salida) por caso resuelto vía LLM (source == "llm").
# Sirve de alarma temprana ante cambios de prompt o de modelo que disparen el costo.
coste_medio_tokens_maximo: 600

# % de casos resueltos por reglas rápidas sin llamar al LLM (métrica de eficiencia, no de
# calidad). El dataset reserva ~25% de sus casos a rutas de regla explícitas, así que un valor
# muy por debajo sugiere que las reglas rápidas se rompieron.
pct_resueltos_por_reglas_minimo: 0.15
