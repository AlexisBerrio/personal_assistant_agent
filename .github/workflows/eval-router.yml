name: eval-router

# Job separado del `ci.yml` principal (§A.10/A.12, ítem 2.4): hace llamadas reales a OpenAI
# (costo + latencia), así que solo corre cuando cambia algo que puede afectar la calidad de
# clasificación del router — nunca en cada push a cualquier rama. `workflow_dispatch` permite
# dispararlo a mano cuando haga falta revalidar sin haber tocado estos archivos.
on:
  push:
    branches: ["**"]
    paths:
      - "src/assistant_personal/infrastructure/prompts/**"
      - "src/assistant_personal/infrastructure/routers/**"
      - "src/assistant_personal/domain/entities.py"
      - "tests/eval/**"
      - "tests/test_eval_router.py"
      - ".github/workflows/eval-router.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "src/assistant_personal/infrastructure/prompts/**"
      - "src/assistant_personal/infrastructure/routers/**"
      - "src/assistant_personal/domain/entities.py"
      - "tests/eval/**"
      - "tests/test_eval_router.py"
      - ".github/workflows/eval-router.yml"
  workflow_dispatch: {}

jobs:
  eval-router:
    runs-on: ubuntu-latest
    env:
      # `Settings` exige MONGO_URI para construirse aunque este job nunca toque Mongo — mismo
      # valor dummy que en `ci.yml`. `OPENAI_API_KEY` acá SÍ es real: viene del secret del
      # repositorio (Settings → Secrets and variables → Actions → Repository secrets), porque
      # este job hace llamadas reales al golden dataset de tests/eval/golden_router.jsonl.
      MONGO_URI: "mongodb://localhost:27017"
      MONGO_DB_NAME: "personal_management"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-4o-mini"
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Instalar Python 3.12
        run: uv python install 3.12

      - name: Sincronizar dependencias
        run: uv sync --extra dev --extra llm --extra mcp --python 3.12

      - name: Diagnóstico de red hacia OpenAI
        # Temporal, mientras se investiga un "Connection error." consistente del cliente Python
        # en este job (ver docs/anexo_arquitectura_objetivo.md, nota del ítem 2.4). Aísla si el
        # problema es DNS, TCP/TLS/firewall, o específico del cliente `openai`/`httpx` — sin
        # imprimir la key en los logs.
        run: |
          echo "--- DNS ---"
          getent hosts api.openai.com || true
          echo "--- TLS/HTTP ---"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" --max-time 10
          echo "--- Resolución completa (lo que ve httpx/Python) ---"
          python3 -c "import socket; print(socket.getaddrinfo('api.openai.com', 443))"
          echo "--- Conectividad IPv6 directa ---"
          curl -6 -sS -o /dev/null -w "IPv6 HTTP %{http_code}\n" https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" --max-time 10 || echo "IPv6 falló"

      - name: "Diagnóstico: la llamada real del SDK, con el traceback completo"
        # `curl` a /v1/models funciona (GET simple), pero el router llama a POST
        # /v1/chat/completions vía AsyncOpenAI (openai==1.54.0 no tiene `client.responses` —
        # el hasattr() de _invoke_model cae siempre al branch de chat.completions, ver el
        # hallazgo documentado en docs/anexo_arquitectura_objetivo.md, nota del ítem 2.4). El
        # SDK de OpenAI envuelve cualquier excepción de conexión de httpx en un genérico
        # "Connection error." que oculta la causa real (SSL, timeout, proxy, lo que sea) — este
        # paso reproduce el método real que se ejecuta, sin ese envoltorio, para ver la
        # excepción original.
        run: |
          uv run --python 3.12 python - <<'EOF'
          import asyncio
          import traceback

          from openai import AsyncOpenAI


          async def main() -> None:
              client = AsyncOpenAI()
              try:
                  response = await client.chat.completions.create(
                      model="gpt-4o-mini",
                      messages=[{"role": "user", "content": "di 'ok'"}],
                      temperature=0,
                  )
                  print("OK:", response.choices[0].message.content)
              except Exception as exc:
                  print("EXCEPTION TYPE:", type(exc))
                  print("REPR:", repr(exc))
                  print("CAUSE:", repr(exc.__cause__))
                  traceback.print_exc()


          asyncio.run(main())
          EOF

      - name: Evaluación del router contra el golden dataset
        # Bloqueante: test_eval_router.py falla si algún umbral de tests/eval/umbrales.yaml no
        # se cumple (ver ejecutar_evaluacion en tests/eval/run_eval.py).
        run: uv run --python 3.12 pytest tests/test_eval_router.py -m eval -v
