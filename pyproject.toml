[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-personal"
version = "0.1.0"
description = "Asistente personal modular (dominio/aplicación/infraestructura/interfaces) — proyecto pedagógico."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.1",
    "pydantic==2.11.0",
    "pydantic-settings==2.14.2",
    "motor==3.7.1",
    "httpx==0.27.2",
    "structlog>=26.1.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
llm = ["openai==1.54.0"]
mcp = ["mcp==1.27.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Definiciones de esquema de FastAPI/Pydantic (Field(..., json_schema_extra={...})): dividirlas
# en múltiples líneas perjudica la legibilidad más de lo que ayuda.
"app.py" = ["E501"]
# Literales de fixtures/mocks en tests: partirlos no aporta claridad.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.assistant_personal.domain.*", "src.assistant_personal.application.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
