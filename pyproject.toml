[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-personal"
version = "0.1.0"
description = "Asistente personal modular (dominio/aplicación/infraestructura/interfaces) — proyecto pedagógico."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.1",
    "pydantic==2.11.0",
    "pydantic-settings==2.14.2",
    "motor==3.7.1",
    "httpx==0.27.2",
    "structlog>=26.1.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
llm = ["openai==1.54.0"]
mcp = ["mcp==1.27.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
